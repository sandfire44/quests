<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quests">
<meta name="theme-color" content="#FFF5F8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Family Quests</title>
<style>
:root{
  --bg:#FFF7EC;--card:#fff;--ink:#2B2340;--muted:#7A7090;--line:#EFE4D4;--accent:#FF6B4A;--accent-ink:#fff;--teal:#1FB5A6;--gold:#FFB703;
  --pend:#FFE29A;--pend-ink:#7A5A00;--ok:#2BB673;--soft:#FFF0E6;--r:20px;
  --font:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI Rounded",system-ui,-apple-system,sans-serif;
}
body.th-cat{--bg:#FFF5F8;--line:#FBDCE6;--accent:#FF7FA6;--soft:#FFE8F0;--teal:#5CBFB2;--gold:#FFC857;--ink:#3A2E3F}
body.th-race{--bg:#EEF3FF;--line:#D3DDF3;--accent:#E63946;--soft:#E4ECFF;--teal:#1D7FD1;--gold:#FFB703;--ink:#14213D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 var(--font)}
body{padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);min-height:100vh;-webkit-user-select:none;user-select:none}
body.th-cat{background-image:radial-gradient(#FFD9E5 1.5px,transparent 1.6px);background-size:26px 26px}
input,textarea,select{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:940px;margin:0 auto;padding:16px 20px 120px}
.top{display:flex;align-items:center;gap:12px;padding:6px 0 14px}
.top h1{margin:0;font-size:1.7rem;font-weight:900;flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.top h1 small{display:block;font-size:.85rem;font-weight:700;color:var(--muted)}
body.th-race .top{position:relative;margin-bottom:16px;padding-bottom:20px}body.th-race .top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;border-radius:3px;background:repeating-conic-gradient(#14213D 0 25%,#fff 0 50%) 0 0/10px 10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800;font-size:1.05rem;white-space:nowrap}
.lock{width:46px;height:46px;border-radius:50%;background:var(--card);border:2px solid var(--line);font-size:1.3rem;display:grid;place-items:center;position:relative;flex:none}
.dot{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:#fff;font-size:.72rem;font-weight:800;display:grid;place-items:center;padding:0 5px}
.tabs{display:flex;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:5px;margin-bottom:16px}
.tabs button{flex:1;padding:10px 6px;border-radius:12px;font-weight:800;color:var(--muted)}
.tabs button[aria-current=true]{background:var(--accent);color:var(--accent-ink)}
h2{font-size:1rem;margin:22px 0 10px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.muted{color:var(--muted)}.note{font-size:.88rem;color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
/* progress track */
.trk{position:relative;height:22px;border-radius:11px;background:var(--line);margin:30px 34px 30px 4px}
.trk>i{display:block;height:100%;border-radius:11px;background:linear-gradient(90deg,var(--gold),var(--accent))}
body.th-race .trk{background:repeating-linear-gradient(90deg,#9AA7C2 0 14px,#B9C4DB 14px 28px);height:26px}
.trk .mv{position:absolute;top:50%;transform:translate(-50%,-62%);font-size:2.1rem;line-height:1;transition:left .6s}
.trk .end{position:absolute;right:-34px;top:50%;transform:translateY(-55%);font-size:1.9rem}
.trk .mk{position:absolute;top:-8px;bottom:-8px;width:3px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}
.trk .mk em{position:absolute;top:34px;left:50%;transform:translateX(-50%);font:800 .72rem var(--font);font-style:normal;white-space:nowrap}
.trk .mk.tm{background:var(--teal)}.trk .mk.tm em{color:var(--teal);top:-22px}
.wkhead{display:flex;justify-content:space-between;gap:6px 14px;flex-wrap:wrap;font-weight:800}
/* quest cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.q{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px;display:flex;gap:14px;align-items:flex-start}
.q.alldone{border-color:#BFEBD3;background:#F6FFF9}
.q .ic{font-size:2.3rem;line-height:1;width:54px;height:54px;display:grid;place-items:center;background:var(--soft);border-radius:18px;flex:none}
.q .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.q .nm{font-weight:900;font-size:1.1rem}.q .dl{font-size:.88rem;color:var(--muted);margin-top:-6px}.q .rw{font-size:.82rem;font-weight:800;color:var(--teal)}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.slot{border-radius:12px;padding:9px 14px;font-weight:800;font-size:.95rem;background:var(--accent);color:var(--accent-ink)}
.slot.p{background:var(--pend);color:var(--pend-ink)}.slot.a{background:#DDF6E8;color:#17804F}
.mast{display:flex;gap:8px;flex-wrap:wrap}.mast span{background:var(--card);border:2px dashed var(--line);border-radius:12px;padding:6px 12px;font-weight:700;font-size:.9rem}
.big{font-size:3rem;font-weight:900;line-height:1;color:var(--accent)}
.meter{height:14px;border-radius:7px;background:var(--line);overflow:hidden;margin-top:8px}.meter i{display:block;height:100%;background:var(--teal)}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.badge{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center;min-width:92px}
.badge b{display:block;font-size:2rem;line-height:1.1}.badge span{font-size:.72rem;font-weight:700;color:var(--muted)}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:.95rem}
.hist div span:last-child{font-weight:800;white-space:nowrap}.plus{color:var(--ok)}.minus{color:var(--accent)}
.entry{padding:12px 0;border-top:1px solid var(--line)}.entry small{color:var(--muted);font-weight:700;display:block}
/* team */
.team{display:flex;align-items:center;gap:14px}
.team .ti{font-size:2.4rem;flex:none}
.team .tb{flex:1;min-width:0}
.team b{display:block;font-weight:900}
.halves{display:flex;gap:6px;margin-top:8px}.halves span{flex:1;height:14px;border-radius:7px;background:var(--line);overflow:hidden}.halves span i{display:block;height:100%;background:var(--teal)}
.yay{background:#FFF8D6;border-color:#F5D96B}
/* forms */
textarea,input[type=text],input[type=number],input[type=password]{font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
textarea{min-height:90px;resize:vertical}
.btn{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:12px 20px;font-weight:800}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}.btn.ok{background:var(--ok);color:#fff}.btn.sm{padding:8px 14px;font-size:.92rem}.btn:disabled{opacity:.4}
.q.bonus{border-color:var(--gold);border-style:dashed;background:#FFFCEB}
.ribbon{font:900 .75rem var(--font);text-transform:uppercase;letter-spacing:.06em;color:#9A6B00}
.tile.bonus{border-color:var(--gold);border-style:dashed;background:#FFFCEB}
.bstrip{display:flex;gap:10px;margin:-4px 0 14px;flex-wrap:wrap}
.bstrip .bc{flex:1;min-width:140px;max-width:220px;display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 12px}
.bstrip .bnote{width:100%;font-size:.75rem;font-weight:700;color:var(--muted);margin-top:-4px}
.bstrip .bc b{font-size:1.8rem;line-height:1}.bstrip .bc .n{font:900 1.3rem/1 var(--font);color:var(--accent)}
.bstrip .bc small{display:block;color:var(--muted);font-weight:700;font-size:.78rem}
.bstrip .bc.zero b{opacity:.35}.bstrip .bc.zero .n{color:var(--muted);font-size:.85rem}
.bstrip .bc.got{border-color:var(--gold);background:#FFFCEB}
.btally{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.bt{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;gap:12px;align-items:center}
.bt b{font-size:2.3rem;line-height:1}.bt .n{font:900 1.5rem/1 var(--font);color:var(--accent)}.bt small{display:block;color:var(--muted);font-weight:700;font-size:.78rem}
.bt .lv{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}.bt .lv i{display:block;height:100%;background:var(--gold)}
.mbank .bal{font:900 2.8rem/1 var(--font);color:#17804F}
.goal{margin-top:12px;background:var(--soft);border-radius:14px;padding:10px 12px}
.mh div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.95rem}.mh div span:last-child{font-weight:800;white-space:nowrap}
/* picture */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tile{background:var(--card);border:4px solid var(--line);border-radius:28px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;position:relative;min-height:230px;justify-content:center}
.tile .em{font-size:5rem;line-height:1}.tile .lb{font-weight:900;font-size:1.15rem}.tile .steps{font-size:1.4rem;letter-spacing:3px}
.tile .sd span{display:inline-flex;gap:4px;font-weight:800;font-size:.95rem;border-radius:999px;padding:4px 10px;background:var(--soft)}
.tile .sd span.p{background:var(--pend);color:var(--pend-ink)}
.tile.done{border-color:#9EE0BE;background:#F3FFF8}.tile.done::after{content:"✓";position:absolute;top:8px;right:14px;font-size:1.8rem;font-weight:900;color:#17804F}
.pbtns{display:flex;gap:14px;margin-top:16px;flex-wrap:wrap}
.pbtn{flex:1;min-width:200px;background:var(--card);border:4px solid var(--line);border-radius:24px;padding:16px;font-weight:900;font-size:1.2rem;display:flex;align-items:center;justify-content:center;gap:10px}.pbtn span{font-size:2.2rem}
/* modal */
.modal{position:fixed;inset:0;background:rgba(30,22,50,.55);z-index:50;display:grid;place-items:center;padding:20px}
.sheet{background:var(--bg);border-radius:28px;width:min(640px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:22px;position:relative}
.sheet.wide{width:min(880px,100%)}
.x{position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:50%;background:var(--card);border:2px solid var(--line);font-size:1.2rem;font-weight:800}
.center{text-align:center}.sheet h3{margin:6px 0;font-size:1.5rem}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px;justify-content:center;margin:16px 0 6px}
.pad button{height:76px;border-radius:22px;background:var(--card);border:2px solid var(--line);font-size:1.7rem;font-weight:800}
.pins{display:flex;gap:14px;justify-content:center;margin:8px 0}.pins i{width:18px;height:18px;border-radius:50%;border:3px solid var(--muted)}.pins i.on{background:var(--ink);border-color:var(--ink)}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.err{color:#D62839;font-weight:700;min-height:1.4em}
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 50px 16px 0}
.ptabs button{padding:9px 13px;border-radius:12px;font-weight:800;background:var(--card);border:2px solid var(--line)}
.ptabs button[aria-current=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.li{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;flex-wrap:wrap}
.li .e{font-size:2rem;flex:none}.li .m{flex:1;min-width:180px}.li .m b{display:block}.li .m small{color:var(--muted)}
.praise{background:#FFF8D6;border:2px solid #F5D96B;border-radius:16px;padding:12px 14px;margin:10px 0;font-weight:600}
.banner{background:#E7F6FF;border:2px solid #B5DDF5;border-radius:16px;padding:12px 14px;margin-bottom:12px;font-weight:600}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.f label{font-weight:800;font-size:.9rem}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{font-size:1.7rem;width:52px;height:52px;border-radius:14px;background:var(--card);border:2px solid var(--line)}
.emojis button[aria-pressed=true]{border-color:var(--accent);background:var(--soft)}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.feel button{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:10px 4px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px}
.feel button b{font-size:2.6rem;line-height:1.1}
.feel button[aria-pressed=true]{border-color:var(--accent);background:var(--soft)}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{padding:8px 12px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-weight:700;font-size:.92rem}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.celebrate{font-size:6rem;animation:pop .6s ease-out}@keyframes pop{0%{transform:scale(.2) rotate(-20deg);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.setup{max-width:600px;margin:30px auto}
.modes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.mode{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:14px;text-align:left}
.mode[aria-pressed=true]{border-color:var(--accent);background:var(--soft)}.mode b{display:block;font-size:1.05rem;margin:4px 0}.mode span{font-size:.84rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;z-index:60;max-width:90vw}
table.rv{width:100%;border-collapse:collapse;font-size:.95rem}table.rv td{padding:8px 4px;border-top:1px solid var(--line)}table.rv td:nth-child(n+2){text-align:right;white-space:nowrap;font-weight:700}
/* timer */
.tmr{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.tmr h3{margin:0;font-size:1.6rem}
.ring{position:relative;width:min(70vw,360px);aspect-ratio:1}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tt{position:absolute;inset:0;display:grid;place-items:center;font:900 clamp(3rem,13vw,5.5rem)/1 var(--font);font-variant-numeric:tabular-nums}
.tmr.low .tt{color:#D62839}.tmr.over{background:#FFF0F0}
.tbtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.tbtns .btn{font-size:1.1rem;padding:14px 24px}
.presets{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0}
.presets button{min-width:96px;padding:14px 12px;border-radius:18px;background:var(--card);border:2px solid var(--line);font-weight:900;font-size:1.3rem}
@media (max-width:640px){.tiles{grid-template-columns:1fr 1fr;gap:12px}.tile{min-height:180px}.tile .em{font-size:3.6rem}.f2,.modes{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div><div id="modal"></div><div id="toast"></div><div id="timer"></div>
<script>
"use strict";
const APP_VERSION="4.4";
/* ===== storage ===== */
const KEY="familyquests.v3";let S=null,mem=null;
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):mem}catch(e){return mem}}
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
/* ===== dates ===== */
const pad2=n=>String(n).padStart(2,"0");
const dkey=d=>d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
const today=()=>dkey(new Date());
function weekKey(d=new Date()){const x=new Date(d);x.setHours(12);x.setDate(x.getDate()-((x.getDay()+1)%7));return dkey(x)}
function lastWeekKey(){const d=new Date();d.setDate(d.getDate()-7);return weekKey(d)}
function nextSat(){const d=new Date();d.setDate(d.getDate()+((6-d.getDay()+7)%7||7));return d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"})}
const nowT=()=>Date.now();
const fmtH=m=>m%60?(m>=60?Math.floor(m/60)+" h "+m%60+" min":m+" min"):(m/60)+(m===60?" hour":" hours");
const fmtDay=t=>new Date(t).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
const uid=()=>Math.random().toString(36).slice(2,9);
const clone=o=>JSON.parse(JSON.stringify(o));
/* ===== themes ===== */
const CAT=`<svg viewBox="0 0 64 56" width="46" height="40" aria-hidden="true"><path d="M9 24 6 2l19 12zM55 24l3-22-19 12z" fill="#FFB3C7"/><ellipse cx="32" cy="32" rx="26" ry="22" fill="#fff" stroke="#FF8FB1" stroke-width="3"/><circle cx="22" cy="30" r="3.4" fill="#3A2E3F"/><circle cx="42" cy="30" r="3.4" fill="#3A2E3F"/><circle cx="23" cy="29" r="1" fill="#fff"/><circle cx="43" cy="29" r="1" fill="#fff"/><ellipse cx="15" cy="38" rx="4.2" ry="2.6" fill="#FFC2D4"/><ellipse cx="49" cy="38" rx="4.2" ry="2.6" fill="#FFC2D4"/><path d="M28 36q4 4 8 0" stroke="#3A2E3F" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M1 31h10M1 37h10M53 31h10M53 37h10" stroke="#FFB3C7" stroke-width="1.6"/></svg>`;
const CAR=`<svg viewBox="0 0 64 32" width="58" height="29" aria-hidden="true"><path d="M3 23q0-8 10-9l9-8h16l10 8q13 1 13 9v3H3z" fill="#E63946"/><path d="M24 8h13l7 6H19z" fill="#BDE0FE"/><path d="M30 8v6" stroke="#E63946" stroke-width="2"/><circle cx="16" cy="26" r="5.4" fill="#14213D"/><circle cx="49" cy="26" r="5.4" fill="#14213D"/><circle cx="16" cy="26" r="2" fill="#fff"/><circle cx="49" cy="26" r="2" fill="#fff"/><circle cx="40" cy="19" r="4" fill="#fff"/><text x="40" y="21.6" font-size="7" font-weight="900" text-anchor="middle" fill="#14213D">4</text></svg>`;
const TOP=`<svg viewBox="0 0 24 24" width="1.05em" height="1.05em" style="vertical-align:-.18em" aria-label="star"><ellipse cx="12" cy="10" rx="10.5" ry="4.4" fill="#E63946"/><ellipse cx="12" cy="9" rx="6.4" ry="2.5" fill="#FFB703"/><path d="M4.5 12 12 23l7.5-11z" fill="#14213D"/><circle cx="12" cy="8.6" r="1.7" fill="#fff"/></svg>`;
const TH={cat:{tok:"🐾",icon:CAT,mv:"🐈",end:"🐟",teamI:"🐱",label:"Kawaii cats"},race:{tok:TOP,icon:CAR,mv:CAR,end:"🏁",teamI:"🏎️",label:"Racing & battle tops"},plain:{tok:"⭐",icon:"⭐",mv:"⭐",end:"🏆",teamI:"⭐",label:"Plain"}};
const th=()=>TH[(S&&S.theme)||"plain"]||TH.plain;
const tok=()=>th().tok;
/* ===== defaults ===== */
const DEF={challengeOn:false,autoOn:false,holidayFeat:false,freeOn:true,holidayCap:180,holidayUntil:"",minPerStar:4,weeklyCap:120,allowCash:false,rateMin:10,ratePence:20,minCash:30,kidTimer:true,maxQuests:6,teamOn:false,teamName:"Team",mate:"",teamPct:65,
  treats:["Film night with popcorn","Choose Saturday dinner","Park or bike trip","Baking together","Board-game night"]};
function starter(lay){
  const pic=lay==="picture";
  return [
    {icon:"👕",name:pic?"Get dressed":"Dressed & ready by 7:30",done:pic?"Pants, socks, clothes, shoes by 7:30. All by myself = 2, with one reminder = 1.":"Dressed, hair done, shoes on by 7:30. No reminder = 2, one reminder = 1.",steps:pic?"🩲🧦👕👖👟":"",praise:"You got yourself ready all by yourself!",repeat:"school",slots:[""],kind:"prompt",reward:2},

/* ===== timer (start/stop, counts down what's available) ===== */
let tickH=null,wl=null;
const tAvail=()=>Math.max(0,Math.min(balance(),curCap()-spentThisWeek()));
function tElapsed(){const T=S&&S.timer;if(!T)return 0;return T.acc+(T.paused?0:Date.now()-T.run)}
const tLeftMs=()=>Math.max(0,S.timer.avail*60000-tElapsed());
const usedMins=()=>{const e=tElapsed();return e<30000?0:Math.max(1,Math.round(e/60000))};
const hhmm=t=>new Date(t).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
function startSession(){
  const av=tAvail();
  if(av<1){$("#modal").innerHTML=sheet(`<div class="center"><div style="font-size:3rem">📺</div><h3>No screen time left</h3><p class="muted">${curCap()-spentThisWeek()<=0?"This week's limit is used up. It resets on Saturday.":"Not enough minutes yet — keep questing!"}</p></div>`);return}
  S.timer={avail:av,acc:0,run:Date.now(),started:Date.now(),paused:false,w5:av<=5,w1:av<=1,n30:1,ended:false};save();
  chime();say("Screen time started. You have "+av+" minutes.");
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(l=>wl=l).catch(()=>{})}catch(e){}renderTimer();
}
function charge(m,T){if(T.free){S.ledger.push({t:nowT(),type:"free",unit:"free",amt:0,mins:m,note:"🎁 Free session: "+T.reason});return}if(m>0)S.ledger.push({t:nowT(),type:"spend",unit:"min",amt:-m,note:`Screen time ${hhmm(T.started)} (${m} min)`})}
function alarm(){chime();setTimeout(chime,700);setTimeout(chime,1400);setTimeout(()=>say("Your screen time has run out. Well done for stopping, "+S.name+"!"),2000)}
function tick(){
  const T=S&&S.timer;if(!T){renderTimer();return}
  if(!T.ended&&!T.paused){const left=tLeftMs(),el=tElapsed();
    if(left<=300000&&!T.w5){T.w5=true;save();chime();say("Five minutes left")}
    if(left<=60000&&!T.w1){T.w1=true;save();chime();say("One minute left")}
    if(el>=T.n30*1800000&&left>60000){say("You've had "+T.n30*30+" minutes of screen time.");T.n30++;save()}
    if(left<=0){T.ended=true;charge(T.avail,T);save();alarm()}}
  renderTimer();
}
function renderTimer(){
  const el=$("#timer");if(!S||!S.timer){el.innerHTML="";clearInterval(tickH);tickH=null;try{wl&&wl.release();wl=null}catch(e){}return}
  const T=S.timer;
  if(T.ended){el.innerHTML=`<div class="tmr over"><div style="font-size:5rem">${S.theme==="race"?"🏁":"⏰"}</div><h3>Time's up, ${esc(S.name)}!</h3><p class="muted" style="margin:0;font-size:1.1rem">That's all your screen time for now. Stopping when it runs out earns a big well done 👏</p><div class="tbtns"><button class="btn" data-act="tdone">I've stopped 👍</button></div></div>`}
  else{const ms=tLeftMs(),sec=Math.ceil(ms/1000),C=2*Math.PI*110,frac=ms/(T.avail*60000),h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);
    const clock=h?`${h}:${pad2(m)}:${pad2(sec%60)}`:`${m}:${pad2(sec%60)}`;
    el.innerHTML=`<div class="tmr${ms<=60000&&!T.paused?" low":""}"><h3>${T.free?"🎁 Free session":S.theme==="race"?"🏎️ Race clock":S.theme==="cat"?"🐱 Screen time":"📺 Screen time"}${T.paused?" — paused":""}</h3>${T.free?`<p class="muted" style="margin:0">${esc(T.reason)} — this doesn't use your minutes</p>`:""}
    <div class="ring"><svg viewBox="0 0 240 240"><circle cx="120" cy="120" r="110" fill="none" stroke="var(--line)" stroke-width="16"/><circle cx="120" cy="120" r="110" fill="none" stroke="${ms<=60000?"#D62839":ms<=300000?"var(--gold)":"var(--teal)"}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"/></svg><div class="tt" style="${h?"font-size:clamp(2.4rem,10vw,4.2rem)":""}"><div>${clock}<small style="display:block;font-size:1.1rem;font-weight:800;color:var(--muted);margin-top:6px">left to use</small></div></div></div>
    <p style="margin:0;font-weight:800">This session so far: ${usedMins()} min</p>
    <p class="muted" style="margin:0">${T.free?"Tap Stop when you finish.":"Tap Stop when you finish — only the minutes you used come off."}</p>
    <div class="tbtns"><button class="btn alt" data-act="tpause">${T.paused?"Carry on":"Pause"}${S.settings.kidTimer?"":" (grown-up)"}</button><button class="btn" data-act="tstop">Stop</button></div></div>`}
  if(!tickH)tickH=setInterval(tick,1000);
}
function startFree(m,reason){S.timer={avail:m,acc:0,run:Date.now(),started:Date.now(),paused:false,w5:m<=5,w1:m<=1,n30:1,ended:false,free:true,reason};save();
  chime();say("A free screen time session! "+m+" minutes. Enjoy, "+S.name+"!");try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(l=>wl=l).catch(()=>{})}catch(e){}renderTimer()}
function startFlow(){if(S.timer){renderTimer();return}S.settings.kidTimer?startSession():askPin("Grown-up: start screen time",startSession)}

async function doExport(){

function migrate(d){
  if(!d||typeof d!=="object"||!Array.isArray(d.quests))return null;
  if(d.v!==3)return null; // pre-launch preview data only
  d.settings={...DEF,...(d.settings||{})};
  ["marks","team","money"].forEach(k=>{if(!d[k]||typeof d[k]!=="object")d[k]={}});
  ["ledger","badges","checkins"].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});
  if(!("next" in d))d.next=null;if(!d.weekOf)d.weekOf=weekKey();if(!d.bkSlot)d.bkSlot=0;
  d.quests.forEach(q=>{if(!Array.isArray(q.slots))q.slots=[""];if(q.kind==="spot"&&!q.badgeIcon)q.badgeIcon=q.icon});
  d.appVersion=APP_VERSION;return d;
}
